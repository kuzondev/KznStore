name: Build and publish Kzn Store
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check release tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content KznStore.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version differ.' }
      - name: Build and publish
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - name: Package and sign
        id: signing
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.KZN_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.KZN_SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX) { Write-Warning 'Signing secrets are not configured; package signing is required for a release.'; exit 1 }
          $signingPath = Join-Path $env:RUNNER_TEMP 'kzn-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($signingPath, [Convert]::FromBase64String($env:SIGNING_PFX))
            ./scripts/package-msix.ps1 -SigningCertificate $signingPath -CertificatePassword $env:SIGNING_PASSWORD
          } finally { if (Test-Path -LiteralPath $signingPath) { Remove-Item -LiteralPath $signingPath -Force } }
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" artifacts/KznStore-installer/*.msix --verify-tag --title "Kzn Store $env:GITHUB_REF_NAME" --generate-notes
